# Rendered by envsubst at container start (only ${API_UPSTREAM} is substituted;
# nginx runtime variables such as $remote_addr are left untouched).
server {
    listen 80;                       # HTTP only (legacy). TLS is terminated by Container Apps ingress in Azure.
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # No URI part -> the original /api/... path is forwarded unchanged.
        # Host header defaults to the upstream host, which Container Apps ingress needs for routing.
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;      # the monthly report is slow on purpose
    }
}
